[package]
name = "keel"
version = "0.1.0"
edition = "2024"
description = "An experimental agent-oriented language and native development protocol"
license = "MIT"
repository = "https://github.com/jakecyr/keel"
readme = "README.md"
include = ["src/**", "examples/**", "!examples/**/.env", "!examples/**/build/**", "!examples/**/logs/**", "!examples/**/runtime/**", "!examples/**/__pycache__/**", "docs/**", "tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LANGUAGE.md", "/LICENSE"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
libc = "=0.2.189"
roxmltree = "=0.21.1"
