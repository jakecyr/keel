name: Prepare release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Require release automation credential
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          test -n "$RELEASE_TOKEN" || { echo 'Configure RELEASE_PLEASE_TOKEN as documented in docs/releases.md'; exit 1; }
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
