name: Pull request title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          title = os.environ['PR_TITLE']
          pattern = r'(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?!?: \S.*'
          if not re.fullmatch(pattern, title):
              raise SystemExit('Use a Conventional Commit title: feat(cli): add a command; append ! before : for breaking changes')
          PYCODE
